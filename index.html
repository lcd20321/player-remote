<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player Remote</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Saira+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a pedal top panel — rig "display" up top, then rows of LED-collar knobs grouped AMP / EQ / RIG, tools folded below */
:root {
  --bg: #121412;          /* graphite steel */
  --plate: #1b1e1b;
  --plate-2: #232723;
  --edge: #30352f;
  --fg: #e9ece6;
  --muted: #8d958a;
  --accent: #6fd39a;      /* LED green */
  --accent-dim: #2b4a37;
  --amber: #f2c14e;       /* edited-rig lamp, like the yellow bank button */
  --bad: #ef7a63;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-display: "Saira Condensed", "Arial Narrow", "IBM Plex Sans KR", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--fg); font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) 40px;
}
main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 600 1rem/1 var(--font-display); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.brand b { color: var(--fg); font-weight: 700; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); }
.led { width: 8px; height: 8px; border-radius: 50%; background: #4a4f49; flex: none; }
.status[data-s="ok"] .led { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.status[data-s="warn"] .led { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.status[data-s="bad"] .led { background: var(--bad); }

/* rig display */
.display {
  background: linear-gradient(180deg, var(--plate-2), var(--plate));
  border: 1px solid var(--edge); border-radius: 16px; padding: 20px 22px 18px;
  display: grid; gap: 10px; position: relative; overflow: hidden;
}
.display::after { /* faint glass sheen */
  content: ""; position: absolute; inset: 0 0 55% 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.035), transparent);
}
.display .label { font: 600 .74rem/1 var(--font-display); letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
.rigname {
  font: 700 clamp(2rem, 7vw, 3.1rem)/1.05 var(--font-display); letter-spacing: .01em;
  margin: 0; text-wrap: balance; overflow-wrap: anywhere; min-width: 0;
}
.rigname.idle { color: var(--muted); }
.rigline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.lamp { display: inline-flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--muted); }
.lamp .led { width: 10px; height: 10px; background: #e7e9e4; box-shadow: 0 0 6px rgba(231,233,228,.5); }
.lamp[data-edited="1"] { color: var(--amber); }
.lamp[data-edited="1"] .led { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
.lamp[data-off="1"] .led { background: #4a4f49; box-shadow: none; }

button {
  font: 600 .9rem/1 var(--font-body); border-radius: 10px; padding: 11px 16px; cursor: pointer;
  border: 1px solid var(--edge); background: var(--plate-2); color: var(--fg);
}
button:hover:not(:disabled) { border-color: var(--muted); }
button.go { background: var(--accent); color: #0d1a12; border-color: var(--accent); }
button:disabled { opacity: .4; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* knob panel */
.panel { background: var(--plate); border: 1px solid var(--edge); border-radius: 16px; padding: 16px 14px 18px; display: grid; gap: 6px; }
.panel h2 { margin: 0 4px; font: 600 .74rem/1 var(--font-display); letter-spacing: .22em; color: var(--muted); text-transform: uppercase; }
.knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px 4px; }
.knob {
  display: grid; justify-items: center; gap: 2px; padding: 8px 2px 6px; border-radius: 12px;
  touch-action: none; user-select: none; cursor: ns-resize; outline: none;
}
.knob:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.knob:hover { background: var(--plate-2); }
.knob svg { width: 78px; height: 78px; overflow: visible; }
.knob .track { fill: none; stroke: var(--edge); stroke-width: 7; stroke-linecap: round; }
.knob .arc { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: butt; transition: stroke-dasharray .12s ease-out; }
.knob .cap { fill: var(--plate-2); stroke: var(--edge); stroke-width: 1; }
.knob .tick { stroke: var(--fg); stroke-width: 3; stroke-linecap: round; }
.knob .num { font: 700 13px var(--font-mono); fill: var(--fg); text-anchor: middle; dominant-baseline: central; }
.knob[data-unknown="1"] .arc { stroke: transparent; }
.knob[data-unknown="1"] .num { fill: var(--muted); }
.knob[data-changed="1"] .arc { stroke: var(--amber); }
.knob .name { font: 600 .82rem/1.2 var(--font-display); letter-spacing: .06em; text-transform: uppercase; text-align: center; }
.knob .sub { font-size: .68rem; color: var(--muted); min-height: 1em; }
.knob[data-disabled="1"] { cursor: default; opacity: .55; }
.help { margin: 2px 4px 0; font-size: .8rem; color: var(--muted); }

/* tone macro knobs */
.macros { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 6px 4px; }
.macros .knob .name { font: 700 .95rem/1.2 var(--font-body); letter-spacing: 0; text-transform: none; }
.whybox { background: none; border: none; border-top: 1px solid var(--edge); border-radius: 0; margin-top: 6px; }
.whybox summary { padding: 12px 4px 4px; }
.why { margin: 4px 4px 0; padding-left: 18px; display: grid; gap: 4px; font-size: .8rem; color: var(--muted); }
.why b { color: var(--fg); font-weight: 600; }
.toolrow { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-top: 6px; }
.memo { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: .85rem; color: var(--muted); }
.memo input { accent-color: var(--accent); }

/* folded tools */
details { background: var(--plate); border: 1px solid var(--edge); border-radius: 14px; }
summary { cursor: pointer; padding: 14px 16px; font: 600 .78rem/1 var(--font-display); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: var(--font-mono); }
details[open] summary::after { content: "–"; }
.fold { padding: 0 16px 16px; display: grid; gap: 12px; min-width: 0; }
.fields { display: flex; flex-wrap: wrap; gap: 10px; }
.fields label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); flex: 1 1 220px; min-width: 0; }
select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--edge); border-radius: 8px; padding: 9px 10px; width: 100%; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .85rem; color: var(--muted); align-items: center; }
.opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.opts input { accent-color: var(--accent); }
.hint { margin: 0; font-size: .82rem; color: var(--muted); }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.slot { border: 1px solid var(--edge); border-radius: 10px; padding: 9px 11px; display: grid; gap: 2px; background: var(--bg); }
.slot .p { font: 600 .72rem var(--font-mono); color: var(--muted); }
.slot .t { font: 700 .95rem var(--font-mono); }
.slot[data-on="1"] { border-color: var(--accent-dim); }
.slot[data-on="1"] .p::after { content: " · ON"; color: var(--accent); }
.log {
  font: 12px/1.6 var(--font-mono); background: var(--bg); border: 1px solid var(--edge); border-radius: 8px;
  padding: 10px 12px; height: 200px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 0;
}
.log .in { color: var(--accent); } .log .out { color: var(--fg); } .log .err { color: var(--bad); } .log .note { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="bar">
    <div class="brand"><b>Player</b> Remote</div>
    <div class="status" id="status" data-s="idle"><span class="led"></span><span id="statusText">연결 안 됨</span></div>
  </div>

  <section class="display" aria-label="현재 릭">
    <div class="label">Rig</div>
    <h1 class="rigname idle" id="rigName">연결을 눌러주세요</h1>
    <div class="rigline">
      <span class="lamp" id="lamp" data-off="1"><span class="led"></span><span id="lampText">Rig Manager를 끄고 연결하세요</span></span>
      <div class="actions">
        <button class="go" id="btnConnect">연결</button>
        <button id="btnRestore" disabled>처음 값으로</button>
      </div>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-tone"><h2 id="h-tone">Tone</h2>
    <div class="macros" id="macros"></div>
    <div class="toolrow">
      <div class="actions"><button id="btnRestore2" disabled>원래대로</button></div>
      <label class="memo"><input type="checkbox" id="chkMemory"> 릭마다 기억했다가 다시 적용</label>
    </div>
    <p class="help" id="toneHint"></p>
    <details class="whybox"><summary>노브마다 왜 이렇게 만들었나</summary><ul class="why" id="why"></ul></details>
  </section>

  <section class="panel" aria-labelledby="h-amp"><h2 id="h-amp">Amp</h2><div class="knobs" id="g-amp"></div></section>
  <section class="panel" aria-labelledby="h-eq"><h2 id="h-eq">EQ · Volume</h2><div class="knobs" id="g-eq"></div>
    <p class="help">노브를 위아래로 끌거나 휠·방향키로 조정. Shift를 누르면 미세 조정, 더블클릭하면 이 릭의 처음 값으로 돌아가요.</p>
  </section>

  <details id="slotBox">
    <summary>이펙트 슬롯</summary>
    <div class="fold">
      <div class="actions"><button id="btnScan" disabled>슬롯 스캔</button></div>
      <p class="hint" id="slotHint">지금 릭의 이펙트 주소를 훑어서 어디에 무엇이 들어있는지 보여줘요.</p>
      <div class="slots" id="slots"></div>
    </div>
  </details>

  <details>
    <summary>연결 설정</summary>
    <div class="fold">
      <div class="fields">
        <label for="selOut">보내는 포트 (→ Player)<select id="selOut"><option>연결을 먼저 누르세요</option></select></label>
        <label for="selIn">받는 포트 (← Player)<select id="selIn"><option>연결을 먼저 누르세요</option></select></label>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="chkAuto" checked> 자동 새로고침</label>
        <span>방식</span>
        <label><input type="radio" name="mode" id="modeSysex" value="sysex" checked> SysEx</label>
        <label><input type="radio" name="mode" id="modeNrpn" value="nrpn"> NRPN</label>
        <span>헤더</span>
        <label><input type="radio" name="hdr" id="hdr027f" value="027f" checked> 02 7F</label>
        <label><input type="radio" name="hdr" id="hdr0000" value="0000"> 00 00</label>
      </div>
      <div class="actions"><button id="btnRead" disabled>지금 다시 읽기</button></div>
    </div>
  </details>

  <details>
    <summary>MIDI 기록</summary>
    <div class="fold">
      <pre class="log" id="log" aria-live="polite"></pre>
      <div class="actions"><button id="btnClear">지우기</button></div>
    </div>
  </details>
</main>

<script>
// ===================== 톤 노브 설정 — 여기 숫자만 바꾸면 돼요 =====================
// 톤 노브 하나가 Player 노브 여러 개를 같이 움직여요. 가운데(0) = 이 릭의 원래 값.
// 숫자 = 그쪽 끝까지 돌렸을 때 바뀌는 양 (Player 화면 숫자 기준). 반만 돌리면 반만 바뀌어요.
//   0~10 노브: gain def clarity sag comp   /   -5~+5 노브: pick bass mid treble presence   /   rigvol: dB
// oneSided: true 면 왼쪽 끝이 '그대로'이고 오른쪽으로만 돌아가요.
const MACROS = [
  { id: "color", left: "몽글", right: "까랑",
    leftSide:  { treble: -1.5, presence: -2, def: -1.5, comp: +2, pick: -1 },
    rightSide: { presence: +2, treble: +1, def: +1.5, clarity: +1.5, gain: -0.5 },
    why: "까랑 쪽은 Presence·Definition을 먼저 열고 Treble은 조금만 올려요. 4kHz 근처(Treble)는 498T가 쏘는 자리라 '귀 아픈 건 싫음'에 걸리기 때문이에요. 게인을 살짝 빼서 찰랑임이 뭉개지지 않게 했어요. 몽글 쪽은 고음을 닫고 압축을 걸어 둥글게 만들어요." },
  { id: "power", left: "깔끔", right: "파워풀",
    leftSide:  { gain: -2, sag: -1.5, bass: -1, rigvol: +1.5 },
    rightSide: { mid: +1.5, pick: +1.5, def: +1, gain: +1, bass: -0.5, sag: -0.5, rigvol: +2 },
    why: "'파워풀하되 더럽지 않게'예요. 기록상 '더럽다'의 1순위 원인은 게인 과다(498T 출력이 셈)라서, 힘은 게인보다 미드·피킹·볼륨으로 내고 게인은 +1까지만 올려요. 깔끔 쪽은 게인·새깅·저음을 덜어요. 소리가 작아지면 귀가 '약하다'고 느끼니까 볼륨을 +1.5dB 채워요." },
  { id: "place", left: "뒤로", right: "앞으로",
    leftSide:  { mid: -1.5, rigvol: -3 },
    rightSide: { mid: +2, bass: -1, presence: +0.5, rigvol: +3 },
    why: "밴드에서 묻힐 때 쓰는 노브예요. 10/24·10/31 합주 분석에서 문제는 500Hz~1.5kHz 몸통이 비는 것과 크기였어요. 그래서 Mid(645Hz)와 볼륨을 같이 올리고, 저음은 베이스 자리라 조금 비켜요. 뒤로는 보컬 뒤나 성일 리드 밑에서 받쳐 줄 때 써요." },
  { id: "attack", left: "부드럽게", right: "단단하게",
    leftSide:  { pick: -2, comp: +2, sag: +1 },
    rightSide: { pick: +2, comp: -2, sag: -1, bass: -0.5 },
    why: "피킹이 얼마나 튀어나오는지예요. DANI 1이 '너무 부드러워'였을 때 효과를 본 게 Pick↑·압축↓였어요. 그때 게인까지 올렸다가 '더러워'졌으니 이 노브는 게인을 안 건드려요." },
  { id: "band", left: "그대로", right: "합주실", oneSided: true,
    rightSide: { gain: -1, bass: -1, mid: +1 },
    why: "집에서 헤드폰(7506)으로 만든 톤을 합주실용으로 바꾸는 보정이에요. 톤 파일 5-1의 표(Gain −1 · Bass −1 · Mid +1) 그대로예요. 끝까지 돌리면 표 값만큼 바뀌어요." },
];
// ==============================================================================

// Kemper Profiler MIDI: parameter = (address page, address number), 14-bit values 0..16383.
// SysEx: F0 00 20 33 <product> <device> <fn> 00 <page> <nr> [<vMSB> <vLSB>] F7
//   fn 0x01 single parameter change, 0x41 single parameter request (answered with 0x01),
//   0x43 string request (answered with 0x03). NRPN: CC99 page, CC98 nr, CC6 MSB, CC38 LSB.
const PARAMS = [
  { g: "amp", key: "gain",     name: "Gain",       sub: "드라이브",   page: 10, nr: 4,  kind: "uni" },
  { g: "amp", key: "def",      name: "Definition", sub: "빈티지↔모던", page: 10, nr: 6,  kind: "uni" },
  { g: "amp", key: "clarity",  name: "Clarity",    sub: "선명도",     page: 10, nr: 7,  kind: "uni" },
  { g: "amp", key: "sag",      name: "Sagging",    sub: "숨쉬는 느낌", page: 10, nr: 8,  kind: "uni" },
  { g: "amp", key: "pick",     name: "Pick",       sub: "피킹 어택",   page: 10, nr: 9,  kind: "bi"  },
  { g: "amp", key: "comp",     name: "Comp",       sub: "압축",       page: 10, nr: 10, kind: "uni" },
  { g: "eq",  key: "bass",     name: "Bass",       sub: "87 Hz",      page: 11, nr: 4,  kind: "bi"  },
  { g: "eq",  key: "mid",      name: "Middle",     sub: "645 Hz",     page: 11, nr: 5,  kind: "bi"  },
  { g: "eq",  key: "treble",   name: "Treble",     sub: "4.4 kHz",    page: 11, nr: 6,  kind: "bi"  },
  { g: "eq",  key: "presence", name: "Presence",   sub: "11.6 kHz",   page: 11, nr: 7,  kind: "bi"  },
  { g: "eq",  key: "rigvol",   name: "Volume",     sub: "릭 볼륨 dB", page: 4,  nr: 1,  kind: "db"  },
];
const byAddr = new Map(PARAMS.map(p => [p.page * 128 + p.nr, p]));
const state = {}, lastSent = {}, dragging = new Set();
let original = {};
let access = null, out = null, inp = null, sysexOK = false;
let rigName = null, nameSupported = false, extChanges = 0, pollTimer = 0, quickTimer = 0;
// stall watch: on Windows the Player sometimes stops answering until the USB cable is re-plugged
let waitingSince = 0, stalled = false;
const scan = { active: false, hits: {} };
const SCAN_FROM = 50, SCAN_TO = 90;

const $ = id => document.getElementById(id);
const hex = arr => Array.from(arr, b => b.toString(16).padStart(2, "0").toUpperCase()).join(" ");
const clamp = v => Math.max(0, Math.min(16383, Math.round(v)));
function log(cls, text) {
  const el = $("log"), line = document.createElement("span");
  line.className = cls; line.textContent = text + "\n"; el.appendChild(line);
  while (el.childNodes.length > 400) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}
function setStatus(s, text) { $("status").dataset.s = s; $("statusText").textContent = text; }
function fmt(p, v) {
  if (v == null) return "–";
  if (p.kind === "uni") return (v / 16383 * 10).toFixed(1);
  const d = (v - 8192) / 8192 * (p.kind === "db" ? 12 : 5);  // rig volume is ±12 dB (checked: DROW 1 = +6.2)
  return (Math.abs(d) < .05 ? "0.0" : (d > 0 ? "+" : "") + d.toFixed(1));
}
const mode = () => document.querySelector('input[name=mode]:checked').value;
const header = () => document.querySelector('input[name=hdr]:checked').value === "027f" ? [0x02, 0x7F] : [0x00, 0x00];

// ---------- knobs ----------
// 270° LED collar from bottom-left (135°) clockwise to bottom-right (45°); path length normalised to 270
const ARC = "M21.72 78.28 A40 40 0 1 1 78.28 78.28";
function buildKnobs() {
  for (const p of PARAMS) {
    const el = document.createElement("div");
    el.className = "knob"; el.id = "k_" + p.key; el.tabIndex = 0;
    el.setAttribute("role", "slider"); el.setAttribute("aria-label", p.name);
    el.setAttribute("aria-valuemin", "0"); el.setAttribute("aria-valuemax", "16383");
    el.dataset.unknown = "1"; el.dataset.disabled = "1";
    el.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">
        <path class="track" d="${ARC}" pathLength="270"/>
        <path class="arc" d="${ARC}" pathLength="270" stroke-dasharray="0 999"/>
        <circle class="cap" cx="50" cy="50" r="30"/>
        <line class="tick" x1="50" y1="22" x2="50" y2="28"/>
        <text class="num" x="50" y="53">–</text>
      </svg>
      <span class="name">${p.name}</span><span class="sub">${p.sub}</span>`;
    $("g-" + p.g).appendChild(el);
    bindKnob(el, p);
  }
}
function drawKnob(p, v) {
  const el = $("k_" + p.key);
  const f = v / 16383;

  fillPorts();
  if (sysexOK && out) {
    $("rigName").textContent = "읽는 중…";
    readAll(false);
  }
  clearInterval(pollTimer); pollTimer = setInterval(pollTick, 800);
}

buildKnobs();
try { $("chkMemory").checked = localStorage.getItem(MEM_ON) === "1"; } catch {}
buildMacros(); drawMacros();
$("btnConnect").addEventListener("click", connect);
$("btnRead").addEventListener("click", () => readAll(false));
$("btnScan").addEventListener("click", scanSlots);
$("btnRestore").addEventListener("click", restoreAll);
$("btnRestore2").addEventListener("click", restoreAll);
$("chkMemory").addEventListener("change", () => {
  try { localStorage.setItem(MEM_ON, $("chkMemory").checked ? "1" : "0"); } catch {}
  if ($("chkMemory").checked) saveMem();
  drawMacros();
});
$("btnClear").addEventListener("click", () => { $("log").textContent = ""; });
$("selOut").addEventListener("change", bindPorts);
$("selIn").addEventListener("change", bindPorts);
// if the name never arrives, still show something sensible once values are in
setInterval(() => {
  if (out && rigName == null && !nameSupported && PARAMS.some(p => state[p.key] != null) && $("rigName").textContent === "읽는 중…")
    { $("rigName").textContent = "현재 릭"; $("rigName").classList.remove("idle"); }
}, 1500);
log("note", "준비됨. Rig Manager를 끄고 연결을 누르세요.");
</script>
</body>
</html>
